name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: Copy-Item target/release/ios-dev-mode.exe ios-dev-mode-windows-x64.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: ios-dev-mode-windows-x64.exe
